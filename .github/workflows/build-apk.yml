name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up correct Android project structure
        run: |
          mkdir -p app/src/main/java app/src/main/res
          # Move Android source files into the proper app module structure if they are in root
          if [ -f "MainActivity.kt" ]; then
            mv MainActivity.kt app/src/main/java/
          fi
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/res/
          fi
          # Update settings.gradle.kts to include app module if not already set
          echo "include(\":app\")" >> settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradebotai-app
          path: "**/build/outputs/apk/debug/*.apk"
