name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Organize Project Structure & Build
        run: |
          # Create standard Android module folder layout
          mkdir -p app/src/main/java/com/tradebot/ai app/src/main/res
          
          # Move Kotlin source file if it's in the root
          if [ -f "MainActivity.kt" ]; then
            if ! grep -q "package com.tradebot.ai" MainActivity.kt; then
              echo "package com.tradebot.ai" > temp_main.kt
              cat MainActivity.kt >> temp_main.kt
              mv temp_main.kt app/src/main/java/com/tradebot/ai/MainActivity.kt
            else
              mv MainActivity.kt app/src/main/java/com/tradebot/ai/
            fi
          fi

          # Move AndroidManifest.xml if it's in the root
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/
          fi

          # Ensure settings.gradle.kts includes the app module
          if ! grep -q "app" settings.gradle.kts; then
            echo 'include(":app")' >> settings.gradle.kts
          fi

          # Make sure app/build.gradle.kts exists and targets proper SDKs
          if [ ! -f "app/build.gradle.kts" ]; then
            mkdir -p app
            cat << 'EOF' > app/build.gradle.kts
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }
            android {
                namespace = "com.tradebot.ai"
                compileSdk = 34
                defaultConfig {
                    applicationId = "com.tradebot.ai"
                    minSdk = 24
                    targetSdk = 34
                    versionCode = 1
                    versionName = "1.0"
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            dependencies {
                implementation("androidx.core:core-ktx:1.12.0")
                implementation("androidx.appcompat:appcompat:1.6.1")
                implementation("com.google.android.material:material:1.11.0")
            }
            EOF
          fi

          # Generate wrapper and build
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradebotai-app
          path: "**/build/outputs/apk/debug/*.apk"
